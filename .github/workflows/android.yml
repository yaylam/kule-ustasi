name: Android AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#1b1f3b' --splashBackgroundColor '#1b1f3b'
      - run: python3 ci/patch_android.py
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
      - run: npx cap sync android
      - name: Derle (imzasiz)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon
          ls -la app/build/outputs/bundle/release app/build/outputs/apk/release
      - name: Surum yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/bundle/release/*.aab kule-ustasi-unsigned.aab
          cp android/app/build/outputs/apk/release/*.apk kule-ustasi-unsigned.apk
          gh release create "build-${{ github.run_number }}" kule-ustasi-unsigned.aab kule-ustasi-unsigned.apk --title "Build ${{ github.run_number }}" --notes "Otomatik derleme"
